# https://taskfile.dev

version: "3"

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
      - task -l
    silent: true
  build:
    desc: Build using version number from .env
    cmds:
      - docker compose -f build/docker-compose.yml build app

  push:
    desc: Push image to registry (requires DOCKER_USERNAME, REPO_NAME, IMAGE_TAG in .env)
    deps:
      - build
    cmds:
      - docker compose -f build/docker-compose.yml push app
