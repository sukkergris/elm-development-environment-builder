name: Release image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:

  check-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches IMAGE_TAG
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/ci/check-release-tag.sh "${{ github.ref_name }}"

  ci:
    needs: [check-tag]
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Builds and pushes the image as a multi-platform manifest list. Image
  # name, tag and platforms come from Taskfile.DOCKER.yml, build/.env and
  # build/docker-compose.yml, the same path as a local build.
  docker-publish:
    needs: [ci]
    runs-on: ubuntu-24.04
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN_RW }}
      - run: task build:publish
