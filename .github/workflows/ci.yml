name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  # Builds the image for every published platform without pushing, so a
  # change that breaks one architecture fails CI rather than the release.
  docker-build:
    runs-on: ubuntu-24.04
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: task build:multi
